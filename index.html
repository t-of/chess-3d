<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2118">
  <meta name="description" content="立体の盤でチェスを 1 から学べる入門。駒の動かし方からチェックメイトまで、触って覚える。2 人で自由に指すこともできる。">
  <title>chess-3d — チェス入門：ルールを 1 から</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="chess-3d">
  <meta property="og:title" content="chess-3d — チェス入門：ルールを 1 から">
  <meta property="og:description" content="立体の盤でチェスを 1 から学べる入門。駒の動かし方からチェックメイトまで、触って覚える。2 人で自由に指すこともできる。">
  <meta property="og:url" content="https://t-of.github.io/chess-3d/">
  <meta property="og:image" content="https://t-of.github.io/chess-3d/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="chess-3d">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">chess-3d</h1>
      <div class="bar__actions">
        <button class="pill" id="soundBtn">音 ON</button>
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="screen" id="title">
      <p class="lead">立体の盤で、チェスを 1 から。<br>駒の動かし方から、チェックメイトまで。</p>
      <p class="muted" id="titleDone"></p>
      <button class="big primary" id="goContinue">つづきから</button>
      <button class="big" id="goList">レッスン一覧</button>
      <button class="big" id="goFree">自由に指す（2 人対戦）</button>
    </section>

    <section class="screen top" id="list" hidden>
      <button class="pill" id="listBack">‹ タイトルへ</button>
      <div class="lessons" id="lessons"></div>
    </section>

    <div id="play" hidden>
      <details class="intro" id="intro" open>
        <summary id="introTitle"></summary>
        <p id="introText"></p>
      </details>
      <section class="stage" id="stage">
        <div class="hud" id="hud">
          <span id="hudText">白の番</span>
          <button class="pill" id="restart">最初から</button>
          <button class="pill" id="freeBack">タイトルへ</button>
        </div>
        <div class="choices" id="choices" hidden></div>
      </section>
      <div class="panel" id="panel">
        <p class="q"><span id="taskProg"></span><span id="taskQ"></span></p>
        <p class="msg" id="taskMsg"></p>
        <div class="row">
          <button class="pill" id="hintBtn">ヒント</button>
          <button class="pill" id="retryBtn">やり直し</button>
          <button class="pill" id="listBtn">一覧へ</button>
          <button class="pill primary" id="nextBtn" hidden>次へ</button>
        </div>
      </div>
    </div>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ ・ <a href="https://t-of.github.io/contact/">問い合わせ</a> ・ <span class="ver">v2</span>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
